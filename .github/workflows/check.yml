name: Check Code

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check-code:
    name: Check Code
    runs-on: ubuntu-latest

    services:
      recovery-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: recovery_test
          POSTGRES_DB: recovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ORMPINDEXER_RECOVERY_TEST_DATABASE_URL: postgres://postgres:recovery_test@localhost:5432/recovery_test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Check no-default-features GraphQL test
        run: cargo test --no-default-features --test graphql_server test_graphql_schema_exposes_pages_without_connections -- --nocapture

      - name: Build release
        run: cargo build --release
